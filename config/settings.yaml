llm:
  provider: gemini            # gemini | claude | openai
  model: gemini-flash-latest
  temperature: 0
  max_output_tokens: 4096
  options:                    # 공급자 전용 옵션. 지원하지 않는 공급자에서는 무시된다
    thinking_level: low       # gemini: minimal | low | medium | high
  pricing: {}                 # 평가 비용 추정용 (USD/100만 토큰). 예: { input_per_mtok: 0.3, output_per_mtok: 2.5 }

embedding:                    # LLM과 별개. DB를 만든 설정과 반드시 같아야 함
  provider: gemini
  model: gemini-embedding-001
  dimensions: 3072

rag:
  # 2026-10-10부터 rag_sources/ 원본에서 새로 만든 DB를 쓴다 (scripts/build_rag.py, docs/RETRIEVAL.md).
  # 기존 DB(./chroma_db_dd3, 컬렉션 campus_rules)는 비교·되돌리기용으로 남겨 둔다.
  chroma_path: ./chroma_db_v2
  collection: danbi_docs
  top_k: 6                    # 2026-10-10 검색 평가: 8 → 6으로 결과 글자 수 약 20% 감소, 정답률 유지 (docs/RETRIEVAL.md)
  # 출처(파일명) → 짧은 이름·내용·기준 시점. search_knowledge 도구 설명과 출처 필터에 쓴다.
  # 여기에 없는 새 출처는 파일명 그대로 노출되고 시작 시 경고가 남는다.
  sources:
    # chroma_db_v2 (scripts/build_rag.py가 rag_sources/ 원본 PDF에서 새로 만든 DB)의 출처
    "(2-1-1)학칙(20260831)_일부개정.pdf":
      short: 학칙
      label: 학칙
      content: 단국대학교 학칙 조항 (학사 운영, 입학, 수업, 학점, 휴·복학, 졸업, 등록금 등)
      as_of: 2026.08.31 개정본
    "(2-1-2)학칙 시행세칙(20260615)_일부개정.pdf":
      short: 학칙 시행세칙
      label: 학칙 시행세칙
      content: 학칙 시행세칙 조항 (수강신청, 재수강, 성적, 휴·복학, 다전공, 조기졸업, 졸업인증 등 세부 기준)
      as_of: 2026.06.15 개정본
    # 기존 DB(chroma_db_dd3)의 출처 — 비교 평가용으로 남겨 둔다 (DB에 없는 출처는 시작 시 경고만 남기고 제외)
    "(2-1-1)학칙(20260507)_일부개정.md":
      short: 학칙
      label: 학칙
      content: 단국대학교 학칙 조항 (학사 운영, 입학, 수업, 학점, 졸업 등)
      as_of: 2026.05.07 개정본
    "(2-1-2)학칙 시행세칙(20260615)_일부개정.md":
      short: 학칙 시행세칙
      label: 학칙 시행세칙
      content: 학칙 시행세칙 조항 (이수 제한, 다전공, 성적, 졸업 세부 기준 등)
      as_of: 2026.06.15 개정본
    "2026-2학기 종합강의시간표 안내자료.pdf":
      short: 강의시간표
      label: 2026-2학기 종합강의시간표 안내자료
      content: 수강신청 일정·유의사항, 수강 정정, 교과목 이수 안내
      as_of: 2026-2학기 한정
    "학사일정.md":
      short: 학사일정
      label: 2026학년도 학사일정
      content: 월별 학사일정 (개강, 시험, 성적, 등록, 휴·복학 기간 등)
      as_of: 2026학년도
    "campus_map_.md":
      short: 캠퍼스맵
      label: 캠퍼스 맵
      content: 캠퍼스 건물·구역 위치와 시설
      as_of: 기준일 미상
    "도서관 운영 시간.md":
      short: 도서관
      label: 도서관 운영 시간
      content: 도서관 운영 시간
      as_of: 기준일 미상
    "셔틀버스 정보.md":
      short: 셔틀버스
      label: 셔틀버스 정보
      content: 죽전캠퍼스 무료 셔틀버스 노선·시간표
      as_of: 기준일 미상

sources:
  registry_path: ./config/sources.yaml
  extra_registry_paths:
    - ./config/sources_departments.yaml   # 학과 일괄 등록 (scripts/review_drafts.py가 초안 검토 결과로 생성)
  dept_list_path: ./config/dept_list.yaml   # python -m scripts.collect_dept_list 로 생성

crawler:
  user_agent: "DanbiBot/0.1 (Dankook University Q&A assistant)"
  min_interval: 1.0           # 같은 호스트 요청 간격(초). 호스트당 동시 요청은 1개
  timeout: 20
  retries: 2                  # 5xx·연결 오류만 재시도
  cache_path: ./cache/danbi_cache.sqlite

ops:                          # LLMOps 추적 (대화·LLM 호출·도구 호출·출처·피드백·감사 로그)
  db_path: ./data/danbi_ops.sqlite
  retention_days: null        # 실행 기록 보관 기간(일). null = 무기한. 정하면 python -m danbi.ops purge 로 삭제 (감사 로그는 남김)
  store_client_ip: true       # 웹 요청 IP 저장
  ip_retention_days: null     # IP만 먼저 지울 기간(일). null = 무기한
  trust_proxy_headers: false  # nginx·Railway 등 리버스 프록시 뒤에서만 true (아니면 X-Forwarded-For 위조 가능)
  proxy_hops: 1               # 앞단 프록시 수 (X-Forwarded-For 오른쪽에서 이 번째 값을 클라이언트로 본다)
  admin_token_env: DANBI_ADMIN_TOKEN   # 개발자 페이지(/dev) 토큰. 값은 .env에만 둔다

limits:                       # 공개 채팅 남용·비용 방어 (하루 = 한국 시간 자정 기준)
  per_ip_per_minute: 10       # 분당 (웹 = IP, 카카오 = 사용자)
  per_user_per_day: 3         # 한 사람의 하루 질문 수 (웹 = IP, 카카오 = 사용자). 추적 DB에서 세므로 재시작해도 유지
  daily_questions: 1000       # 웹 채널 전체 하루 질문 수 상한
  daily_tokens: 20000000      # 웹 채널 전체 하루 토큰(입력+출력) 상한
  max_concurrent: 4           # 동시에 답하는 질문 수
  admin_auth_failures: 10     # IP당 10분에 허용하는 개발자 토큰 실패 횟수

auth:                         # Google 로그인 — 클라이언트 ID·비밀값 등은 환경 변수 (docs/GOOGLE_LOGIN.md)
  allow_anonymous: false      # 로그인 없이 채팅 (구현돼 있음, 지금은 끔). 로컬 개발은 DANBI_ALLOW_ANONYMOUS=1
  allowed_domain: dankook.ac.kr   # 학교 Google 계정만
  session_days: 30            # 로그인 유지 (쓸 때마다 연장)
  admin_session_hours: 12     # 개발자 페이지는 로그인한 지 12시간 안에만

kakao:                        # 카카오톡 챗봇 스킬 (KAKAO_SKILL_SECRET 환경 변수가 있을 때만 열림) — docs/KAKAO_SETUP.md
  callback_hosts: [kakao.com, kakaoenterprise.com]   # 이 도메인의 콜백 URL만 호출한다
  sync_timeout: 4.3           # 콜백을 못 쓸 때 이 안에 답해야 한다 (카카오 스킬 제한 5초)

agent:
  max_tool_calls: 10          # 병렬 호출도 1건씩 센다
  timeout_seconds: 60
  inline_source_limit: 20     # 검토된 웹 소스가 이 수 이하면 도구 설명에 목록을 직접 넣음
  memory: false               # 이전 질문·답변을 LLM에 함께 보냄 (비용↑, 지금은 끔). 꺼도 대화 기록·사이드바는 그대로
