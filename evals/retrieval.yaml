# 검색(RAG) 평가 세트 — LLM 없이 search_knowledge의 검색 결과만 채점한다 (evals/retrieval_run.py).
#
# gold: 이 중 하나라도 맞는 청크가 정답. 항목 안의 조건은 모두 맞아야 한다.
#   src:  출처 짧은 이름 (config/settings.yaml rag.sources의 short)
#   head: 대·중·소제목 중 하나에 들어 있어야 할 말
#   text: 청크 본문에 들어 있어야 할 말
# 2026-10-10 DB(chroma_db_dd3)의 실제 제목을 보고 정했다.

- id: leave-max
  q: 휴학은 최대 몇 학기까지 할 수 있어?
  gold: [{src: 학칙 시행세칙, head: 휴학기간 및 휴학횟수}, {src: 학칙, head: 제21조(휴학)}]
- id: leave-military
  q: 군대 가면 휴학 기간은 어떻게 돼?
  gold: [{src: 학칙, head: 입대휴학}, {src: 학칙 시행세칙, head: 휴학기간 및 휴학횟수}]   # 학칙 제23조는 2025.5.28. 삭제됨 → 시행세칙 제15조 ②
- id: return-when
  q: 복학 신청은 언제 해야 해?
  gold: [{src: 학칙 시행세칙, head: 복학}, {src: 학칙, head: 제24조(복학)}, {src: 학사일정, head: 복학 및 재입학 신청}]   # '언제'에는 학사일정의 신청 기간도 정답
- id: warning-expel
  q: 학사경고 몇 번 받으면 제적이야?
  gold: [{src: 학칙, head: 학사경고}, {src: 학칙, head: 제26조(제적)}]
- id: readmission
  q: 재입학 조건이 뭐야?
  gold: [{src: 학칙, head: 재입학 자격}]
- id: grad-credits
  q: 졸업하려면 몇 학점 들어야 해?
  gold: [{src: 학칙, head: 졸업요건}, {src: 학칙, head: 기준학점}, {src: 강의시간표, text: 졸업요구학점}]   # 입학년도별 이수기준표의 졸업요구학점도 정답
- id: early-grad
  q: 조기졸업 하려면 성적이 어느 정도여야 해?
  gold: [{src: 학칙 시행세칙, head: 조기졸업 신청자격}]
- id: max-credits
  q: 한 학기에 최대 몇 학점까지 수강신청 가능해?
  gold: [{src: 학칙 시행세칙, head: 학기당 수강학점}]
- id: retake-grade
  q: 재수강하면 성적은 최고 몇 점까지 받을 수 있어?
  gold: [{src: 학칙 시행세칙, head: 동일과목 재수강}]
- id: drop-credit
  q: 학점 포기 제도 있어?
  gold: [{src: 학칙 시행세칙, head: 학점포기}]
- id: grade-correct
  q: 성적 정정은 어떻게 신청해?
  gold: [{src: 학칙 시행세칙, head: 성적정정}]
- id: sick-absence
  q: 아파서 결석하면 출석 인정돼?
  gold: [{src: 학칙 시행세칙, head: 유고결석자}]
- id: multimajor-limit
  q: 다전공 이수가 제한되는 단과대는 어디야?
  gold: [{src: 학칙 시행세칙, head: 다전공 허용범위}]
- id: multimajor-change
  q: 다전공 바꿀 수 있어?
  gold: [{src: 학칙 시행세칙, head: 다전공이수 변경}]
- id: credit-hours
  q: 1학점은 몇 시간 수업이야?
  gold: [{src: 학칙, head: 교과이수단위}]
- id: article-29
  q: 학칙 제29조 내용 알려줘
  gold: [{src: 학칙, head: 제29조(교과이수단위)}]
- id: tuition-refund
  q: 등록금 환불은 어떻게 돼?
  gold: [{src: 학칙, head: 등록금 등의 반환}]
- id: scholarship-rule
  q: 장학금은 어떤 기준으로 줘?
  gold: [{src: 학칙, head: 제77조(장학금)}]
- id: transfer-qual
  q: 편입학 자격 알려줘
  gold: [{src: 학칙, head: 편입학 자격}]
- id: grad-cert-fail
  q: 졸업인증 못 받으면 어떻게 돼?
  gold: [{src: 학칙 시행세칙, head: 졸업인증 미취득자}]
- id: thesis-replace
  q: 졸업논문 대신 다른 걸로 대체할 수 있어?
  gold: [{src: 학칙 시행세칙, head: 졸업논문 대체}]
- id: course-change
  q: 수강신청 정정 기간에 과목 바꿀 수 있어?
  gold: [{src: 학칙 시행세칙, head: 수강신청 정정}]
- id: lib-vacation
  q: 도서관 자료실 방학 때 몇 시까지 열어?
  gold: [{src: 도서관, head: 자료실 방학 중}]
- id: law-library
  q: 법학도서관 열람실 이용시간
  gold: [{src: 도서관, head: 법학도서관 일반 열람실}]
- id: shuttle-first
  q: 죽전역 셔틀 첫차 몇 시야?
  gold: [{src: 셔틀버스, head: 학기 중 오전 운행}]
- id: shuttle-summer
  q: 계절학기에도 셔틀 다녀?
  gold: [{src: 셔틀버스, head: 계절학기}]
- id: map-bumjeong
  q: 범정관은 어디 있어?
  gold: [{src: 캠퍼스맵, head: 범정관, text: 위치}]
- id: map-gomsang
  q: 곰상 어디야?
  gold: [{src: 캠퍼스맵, head: 평화의 광장}]
- id: map-engineering
  q: 공학관은 어디에 있어?
  gold: [{src: 캠퍼스맵, head: 공학관}]
- id: cal-final
  q: 기말고사 기간 언제야?
  gold: [{src: 학사일정, head: 기말고사}]
- id: cal-register
  q: 수강신청 언제야?
  gold: [{src: 학사일정, head: 수강신청}]
- id: lang-cert
  q: 졸업하려면 토익 몇 점 필요해?
  gold: [{src: 강의시간표, head: 공인외국어 졸업인증}]
- id: linked-major
  q: 연계전공은 어떻게 운영돼?
  gold: [{src: 학칙, head: 융합전공 및 연계전공}, {src: 강의시간표, head: 연계전공 운영}]
- id: period-start
  q: 1교시는 몇 시에 시작해?
  gold: [{src: 강의시간표, head: 7. 강의시간표}]

