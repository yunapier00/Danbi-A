# 검색 평가 검증용 세트 — 설정 조정(retrieval.yaml)에 쓰지 않은 질문. 최종 설정 확인에만 쓴다 (과적합 점검).
# 2026-10-10 작성. 형식은 retrieval.yaml과 같다.

- id: ho-suspend-tuition
